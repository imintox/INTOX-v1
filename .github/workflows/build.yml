name: Build

# Only the main branch publishes the theme. Other branches cannot change what users load.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the build job below may write (to publish the gh-pages branch).
permissions:
  contents: read

# Never let two deploys overlap.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  project:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to exact commits so a changed tag upstream can't alter this build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9 # must match the lockfile format (9.0) so exact, checksum-verified versions are installed
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
